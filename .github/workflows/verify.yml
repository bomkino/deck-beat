# Builds Deck Beat and beat-lab on an Apple silicon runner with Xcode, for each
# push, each pull request from a fork and on demand, then runs beat-lab's CPU
# checks, renders its contact sheet and demo clip, and opens the app bundle to
# render a still and capture its window. The renders are kept as the
# deck-beat-lab artifact. The render needs Metal; on a runner without it
# beat-lab says "skipped:" and passes. scripts/verify.sh renders every Look
# through the app; run it locally before a release.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # A pull request from a branch of this repository is already built by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build Deck Beat
        run: swift build -c release --product DeckBeat
      - name: Build beat-lab
        run: swift build -c release --product beat-lab
      - name: Run the beat-lab checks
        run: |
          "$(swift build -c release --show-bin-path)/beat-lab" check
      - name: Render the contact sheet and demo clip
        run: |
          "$(swift build -c release --show-bin-path)/beat-lab" render --out lab-output
      - name: Open the app, render a still and capture its window
        run: |
          bash scripts/build.sh release
          APP="../dist/Deck Beat.app/Contents/MacOS/DeckBeat"
          mkdir -p lab-output
          # A new window with the sample deck and demo groove, rendered through the app's own session.
          perl -e 'alarm 240; exec @ARGV' "$APP" --still lab-output/app-still.png --look ripple --format reel --time 2
          # The whole window, inspector and transport included, once it has settled.
          perl -e 'alarm 240; exec @ARGV' "$APP" --snapshot lab-output/app-window.png --time 2 --settle 3
          # A small copy of the window in the log, for reviewers who can't download the artifact.
          sips -s format jpeg -s formatOptions 70 -Z 1200 lab-output/app-window.png --out "$RUNNER_TEMP/window.jpg" >/dev/null
          echo "thumbnail: app-window.jpg"
          base64 -b 1000 -i "$RUNNER_TEMP/window.jpg" | sed 's/^/b64w /'
      - name: Keep the renders
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deck-beat-lab
          path: lab-output
          if-no-files-found: ignore
